repos:
  - repo: https://github.com/secondlife/git-hooks.git
    rev: v1.0.2
    hooks:
      - id: opensource-license
      - id: llsd
      - id: no-trigraphs
      - id: copyright
      - id: end-of-file
        files: \.(cpp|c|h|py|glsl|cmake|txt)$
        exclude: language.txt
      - id: indent-with-spaces
        files: \.(cpp|c|h|inl|py|glsl|cmake)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-xml
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(cpp|c|h|inl|py|glsl|cmake|yaml|sh)$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: check-action-pinning
        name: Check GitHub Actions SHA Pinning
        entry: python3 -c "import json, subprocess, sys; res = subprocess.run(['zizmor', '--format', 'json', '.'], capture_output=True, text=True); findings = json.loads(res.stdout); unpinned = [f for f in findings if f.get('ident') == 'unpinned-uses']; sys.exit(1 if unpinned else 0)"
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
