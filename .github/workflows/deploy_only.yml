name: Deploy Viewer

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_run_number:
        description: 'GitHub Run Number (per build_viewer.yml workflow)'
        required: true
      viewer_version:
        description: 'viewer version not including build'
        required: true
        default: '7.1.10'
      viewer_build:
        description: 'build id'
        required: true
        default: '799999'
      viewer_release_type:
        description: 'release type'
        required: true
        default: 'Release'
      branch:
        description: 'Branch to deploy from'
        required: false
        default: 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            fsutils/download_list.py
            fsutils/build_config.json
            fsutils/build_config.py
            fsutils/parse_workflow_inputs.py
          sparse-checkout-cone-mode: false
          ref: ${{ github.head_ref || github.ref_name || 'master' }}
          fetch-depth: 1        

      - name: Install discord-webhook library
        run: pip install discord-webhook

      - name: Download Build Artifacts
        uses: dawidd6/action-download-artifact@v11
        id: download
        with:
          workflow: build_viewer.yml
          run_number: ${{ github.event.inputs.build_run_number  }}
          path: to_deploy    

      - name: Parse workflow inputs and resolve deploy environment
        env:
          VIEWER_RELEASE_TYPE: ${{ github.event.inputs.viewer_release_type }}
          VIEWER_VERSION: ${{ github.event.inputs.viewer_version }}
          VIEWER_BUILD: ${{ github.event.inputs.viewer_build }}
          BUILD_RUN_NUMBER: ${{ github.event.inputs.build_run_number }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          BETA_WEBHOOK_URL: ${{ secrets.BETA_WEBHOOK_URL }}
          NIGHTLY_WEBHOOK_URL: ${{ secrets.NIGHTLY_WEBHOOK_URL }}
          MANUAL_WEBHOOK_URL: ${{ secrets.MANUAL_WEBHOOK_URL }}
        run: python ./fsutils/parse_workflow_inputs.py deploy

      - name: List artifacts download
        run: ls -R
        working-directory: to_deploy

      - name: Reorganise artifacts ready for server upload.
        env:
          FS_VIEWER_VERSION: ${{ github.event.inputs.viewer_version }}
          FS_VIEWER_BUILD: ${{ github.event.inputs.viewer_build }}
          FS_VIEWER_RELEASE_TYPE: ${{ github.event.inputs.viewer_release_type }}
          FS_VERSION_MGR_KEY: ${{ secrets.FS_VERSION_MGR_KEY }}
          FS_BUILD_WEBHOOK_URL: ${{ env.FS_BUILD_WEBHOOK_URL }}
        run: python ./fsutils/download_list.py ./to_deploy -w "$FS_BUILD_WEBHOOK_URL"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'to_deploy/${{ env.FS_RELEASE_FOLDER }}/**/*'

      - name: Setup rclone and download the folder
        uses: beqjanus/setup-rclone@main
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Copy files to remote host
        env:
          FS_RELEASE_FOLDER: ${{ env.FS_RELEASE_FOLDER }}
        run: rclone copy "./to_deploy/$FS_RELEASE_FOLDER" "fs_r2_deploy:viewerdownloads/$FS_RELEASE_FOLDER"

