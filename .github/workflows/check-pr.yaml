name: Check PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const description = context.payload.pull_request.body || '';
            if (description.trim().length < 20) {
              core.setFailed("❌ PR description is too short. Please provide at least 20 characters.");
            }

  test-fsutils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run fsutils unit tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s fsutils/tests -t . -v

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run zizmor action pinning linter
        run: |
          pip install zizmor
          python3 -c "import json, subprocess, sys; res = subprocess.run(['zizmor', '--format', 'json', '.'], capture_output=True, text=True); findings = json.loads(res.stdout); unpinned = [f for f in findings if f.get('ident') == 'unpinned-uses']; sys.exit(1 if unpinned else 0)"

