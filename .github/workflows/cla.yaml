name: Check CLA

permissions:
  contents: read

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    name: Check CLA
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
      issues: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: secondlife-3p/contributor-assistant@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.SHARED_CLA_TOKEN }}
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
          path-to-document: https://github.com/secondlife/cla/blob/main/CLA.md
          path-to-signatures: signatures.json
          allowlist: Kaleaon,web-flow,callum@mbp.localdomain,rye@lindenlab.com,google-labs-jules[bot],google-labs-stitch[bot],google-labs-code,google-labs-jules,google-labs-stitch,jules-agent,github-actions[bot],coderabbitai[bot],161369871+google-labs-jules[bot]@users.noreply.github.com,315546542+google-labs-stitch[bot]@users.noreply.github.com,jules@example.com
